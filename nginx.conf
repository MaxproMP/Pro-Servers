# === BLOQUE HTTP (Puerto 80) — Cloudflare Flexible conecta aquí ===
server {
    listen 80;
    server_name professional-servers.com.ar www.professional-servers.com.ar _;

    location = /ping {
        proxy_pass http://minecraft-panel-backend:3000;
        proxy_set_header Host $host;
    }

    # 1. FRONTEND (Lo que ve el usuario)
    location / {
        proxy_pass http://minecraft-panel-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Redirigir panel.html a index.html por si quedó en caché
        rewrite ^/panel\.html$ /index.html permanent;

        # LA MAGIA: Si piden la raíz (/), mostramos silenciosamente Entrada.html
        # Si piden otra cosa (ej: /index.html), buscamos eso.
        rewrite ^/$ /Entrada.html break;
    }

    # 2. RUTAS DE PROYECTO, CURSEFORGE Y SERVER → NODE.JS (El Músculo)
    location /api/project/ {
        proxy_pass http://minecraft-panel-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/server/ {
        proxy_pass http://minecraft-panel-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/curseforge/ {
        proxy_pass http://minecraft-panel-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. LARAVEL API (El Cerebro — auth, usuarios, pagos)
    location /api/ {
        proxy_pass http://minecraft-panel-laravel:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 4. NODE.JS BACKEND directo (Rutas /daemon/)
    location /daemon/ {
        rewrite ^/daemon/(.*) /$1 break;
        proxy_pass http://minecraft-panel-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 5. WEBSOCKETS (Consola en Vivo de Node)
    location /socket.io/ {
        proxy_pass http://minecraft-panel-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# === BLOQUE HTTPS (Puerto 443) — Respaldo si Cloudflare cambia a Full ===
server {
    listen 443 ssl;
    server_name professional-servers.com.ar www.professional-servers.com.ar _;

    ssl_certificate     /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location = /ping {
        proxy_pass http://minecraft-panel-backend:3000;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass http://minecraft-panel-frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Redirigir panel.html a index.html por si quedó en caché
        rewrite ^/panel\.html$ /index.html permanent;

        # LA MAGIA (Mismo comportamiento en HTTPS)
        rewrite ^/$ /Entrada.html break;
    }

    location /api/project/ {
        proxy_pass http://minecraft-panel-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/server/ {
        proxy_pass http://minecraft-panel-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/curseforge/ {
        proxy_pass http://minecraft-panel-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        proxy_pass http://minecraft-panel-laravel:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /daemon/ {
        rewrite ^/daemon/(.*) /$1 break;
        proxy_pass http://minecraft-panel-backend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://minecraft-panel-backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}