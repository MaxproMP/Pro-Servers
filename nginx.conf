# Docker DNS interno: re-resuelve los upstreams para que un contenedor recreado (nueva IP) no cause 502.
resolver 127.0.0.11 valid=10s ipv6=off;
server_tokens off;
client_max_body_size 25m;

# === IP real del visitante detrás de Cloudflare (rangos de cloudflare.com/ips) ===
# Sin esto, Laravel ve la IP de Cloudflare y los límites por IP se comparten entre todos.
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;
real_ip_header CF-Connecting-IP;

# === Cabeceras de seguridad (se heredan en todos los server/location) ===
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Strict-Transport-Security "max-age=15552000" always;
# CSP: 'unsafe-inline' es necesario mientras el frontend use <script> y onclick inline.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.gstatic.com https://apis.google.com https://cdn.jsdelivr.net https://unpkg.com https://cdnjs.cloudflare.com https://cdn.tailwindcss.com https://cdn.socket.io; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self'; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://www.gstatic.com https://cdn.jsdelivr.net https://piston-meta.mojang.com https://fill.papermc.io https://api.purpurmc.org https://meta.fabricmc.net; frame-src https://proffesional-server.firebaseapp.com https://accounts.google.com https://*.firebaseapp.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# === BLOQUE HTTP (Puerto 80) — Cloudflare Flexible conecta aquí ===
server {
    listen 80;
    set $up_front   http://minecraft-panel-frontend:80;
    set $up_laravel http://minecraft-panel-laravel:80;
    set $up_node    http://minecraft-panel-backend:3000;

    server_name professional-servers.com.ar www.professional-servers.com.ar _;

    # El demonio Node NO se publica: solo /ping (salud) y /socket.io (consola con token + propiedad).
    location = /ping {
        proxy_pass $up_node;
        proxy_set_header Host $host;
    }

    # 1. FRONTEND
    location / {
        proxy_pass $up_front;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        rewrite ^/panel\.html$ /index.html permanent;
        # La raíz muestra Entrada.html
        rewrite ^/$ /Entrada.html break;
    }

    # 2. LARAVEL API (auth, usuarios, pagos y proxy firmado hacia Node)
    location /api/ {
        proxy_pass $up_laravel;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 3. CONSOLA EN VIVO
    location /socket.io/ {
        proxy_pass $up_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}

# === BLOQUE HTTPS (Puerto 443) — Respaldo si Cloudflare cambia a Full ===
server {
    listen 443 ssl;
    set $up_front   http://minecraft-panel-frontend:80;
    set $up_laravel http://minecraft-panel-laravel:80;
    set $up_node    http://minecraft-panel-backend:3000;

    server_name professional-servers.com.ar www.professional-servers.com.ar _;

    ssl_certificate     /etc/nginx/ssl/origin.crt;
    ssl_certificate_key /etc/nginx/ssl/origin.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location = /ping {
        proxy_pass $up_node;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass $up_front;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;

        rewrite ^/panel\.html$ /index.html permanent;
        rewrite ^/$ /Entrada.html break;
    }

    location /api/ {
        proxy_pass $up_laravel;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass $up_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
