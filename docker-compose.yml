services:
  # PROXY PRINCIPAL
  proxy:
    image: nginx:alpine
    container_name: minecraft-panel-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
      - laravel-api
      - backend
    networks:
      - minecraft-net

  # FRONTEND (Tus HTML limpios)
  frontend:
    build: ./frontend
    container_name: minecraft-panel-frontend
    restart: unless-stopped
    networks:
      - minecraft-net

  # BACKEND (Node.js)
  backend:
    build: ./backend
    container_name: minecraft-panel-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./data:/usr/src/app/data
      - ./servers:/usr/src/app/servers
      - ./backend/firebase-adminsdk.json:/usr/src/app/firebase-adminsdk.json
    networks:
      - minecraft-net

  # CEREBRO (Laravel API)
  laravel-api:
    build: ./core
    container_name: minecraft-panel-laravel
    restart: unless-stopped
    volumes:
      - ./core:/var/www/html
    networks:
      - minecraft-net

  # DISCORD BOT
  discord-bot:
    build: ./proservers-bot
    container_name: minecraft-discord-bot
    restart: unless-stopped
    env_file:
      - ./core/.env
    networks:
      - minecraft-net

networks:
  minecraft-net:
    name: minecraft-panel_minecraft-net
    driver: bridge